<!doctype html>
<html ⚡ lang="en">
<head>
<meta charset="utf-8">
<title>AMP Escape Matrix Probe v2</title>
<link rel="canonical" href="https://ithrael.github.io/amp-sec-test/amp-test.html">
<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
<style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
<script async src="https://cdn.ampproject.org/v0.js"></script>
<script async custom-element="amp-analytics" src="https://cdn.ampproject.org/v0/amp-analytics-0.1.js"></script>
<script async custom-element="amp-list" src="https://cdn.ampproject.org/v0/amp-list-0.1.js"></script>
<script async custom-template="amp-mustache" src="https://cdn.ampproject.org/v0/amp-mustache-0.2.js"></script>
<script async custom-element="amp-bind" src="https://cdn.ampproject.org/v0/amp-bind-0.1.js"></script>
<script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
<script async custom-element="amp-iframe" src="https://cdn.ampproject.org/v0/amp-iframe-0.1.js"></script>
<script async custom-element="amp-form" src="https://cdn.ampproject.org/v0/amp-form-0.1.js"></script>
<script type="application/ld+json">{"@context":"http://schema.org","@type":"Article","headline":"AMP PROBE P1 <script>alert('P1-JSONLD')</script> \u003cb\u003etag\u003c/b\u003e"}</script>
<style amp-custom>body{font-family:sans-serif}.p{color:#036}</style>
</head>
<body>
<h1 id="probe-root">AMP-TESTPAGE-V2</h1>
<p class="p">P8 entity probe: &lt;script&gt;alert('P8-ENTITY')&lt;/script&gt; / ampersand &amp; / quote &quot; / unicode-line-sep &#8232;</p>

<!-- V1: amp-analytics inline config -> OOB ping -->
<amp-analytics>
<script type="application/json">
{"requests":{"oobPing":"https://api.anyongtech.cn/ws-oob/cb/ampprobe1/ping?url=${canonicalUrl}&t=${title}&r=${random}"},"triggers":{"pageLoad":{"on":"visible","request":"oobPing"}}}
</script>
</amp-analytics>

<!-- V2: amp-analytics remote config fetch -->
<amp-analytics config="https://ithrael.github.io/amp-sec-test/analytics-config.json">
<script type="application/json">{"vars":{"accountId":"probe-v2"}}</script>
</amp-analytics>

<!-- V3: amp-list remote JSON + mustache -->
<amp-list src="https://ithrael.github.io/amp-sec-test/list.json" layout="fixed-height" height="120" binding="no">
<template type="amp-mustache">
<div>item: {{item}}</div>
<div>html: {{htmlProbe}}</div>
<a href="{{linkProbe}}">v3 link</a>
</template>
</amp-list>

<!-- V4: amp-iframe sandboxed -->
<amp-iframe src="https://ithrael.github.io/amp-sec-test/frame.html" width="300" height="150" sandbox="allow-scripts allow-popups allow-forms" layout="responsive"></amp-iframe>

<!-- V5: amp-ad -->
<amp-ad width="300" height="250" type="adsense" data-ad-client="ca-pub-0000000000000000" data-ad-slot="0000000000"></amp-ad>

<!-- V6: form action-xhr -> OOB -->
<form method="post" action-xhr="https://api.anyongtech.cn/ws-oob/cb/ampprobe1/form-post" target="_top"><input type="text" name="q" value="probe"><input type="submit" value="v6"></form>

<!-- V7: bind state -->
<p [text]="foo">bind-default</p>
<button on="tap:AMP.setState({foo: 'P7-SETSTATE'})">set state</button>

<p id="notes">canonical-check-marker</p>
</body>
</html>
